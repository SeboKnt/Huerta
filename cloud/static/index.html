<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huerta Bewässerung</title>
  <style>
    :root {
      --bg: #eef4ef;
      --panel: #fffdf8;
      --ink: #1f2a24;
      --muted: #5f6b63;
      --line: #d5ddd7;
      --accent: #0d9488;
      --accent-soft: #e6f6f3;
      --danger: #b42318;
      --ok: #1f7a3d;
      --warn: #855b00;
      --chip: #e8efe9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 85% 0%, #cfe9dc 0%, transparent 32%),
        radial-gradient(circle at 0% 100%, #f2e8d8 0%, transparent 28%),
        var(--bg);
      padding: 24px;
    }

    .wrap { max-width: 1200px; margin: 0 auto; }

    .hero { margin-bottom: 20px; animation: rise 0.45s ease-out; }
    h1 { margin: 0; font-size: clamp(1.6rem, 3vw, 2.4rem); }
    .subtitle { margin: 8px 0 0; color: var(--muted); }

    .topbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .badge, .health-badge {
      background: var(--chip);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.85rem;
    }

    .health-badge { display: inline-flex; align-items: center; gap: 8px; }
    .health-dot {
      width: 10px; height: 10px; border-radius: 999px; background: #9ca3af;
    }
    .health-dot.up { background: #16a34a; box-shadow: 0 0 0 4px rgba(22,163,74,.15); }
    .health-dot.down { background: #dc2626; box-shadow: 0 0 0 4px rgba(220,38,38,.15); }

    .search-input {
      min-width: 220px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-family: inherit;
      background: #fff;
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-family: inherit;
      transition: transform .12s ease, border-color .15s ease;
    }
    button:hover { transform: translateY(-1px); border-color: #9fb0a4; }
    .btn-dark { background: #1d2b24; color: #fff; border-color: #1d2b24; }
    .btn-accent { background: var(--accent-soft); border-color: #b8e4dd; color: #0e5f58; }
    .btn-danger { background: #fff3f2; border-color: #ffd9d6; color: #8a1c13; }
    .btn-soft { background: #f4f1e8; }

    .device-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }

    .device-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 12px 32px rgba(31,42,36,.07);
      overflow: hidden;
      animation: rise .5s ease-out;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid #ece7db;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .card-title { margin: 0; font-size: 1.15rem; }
    .card-sub { margin: 4px 0 0; color: var(--muted); font-size: 0.88rem; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.82rem;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .chip.online { color: var(--ok); background: #ebf8ef; border-color: #ccebd5; }
    .chip.offline { color: var(--danger); background: #fff3f2; border-color: #ffd9d6; }
    .chip.restarting { color: var(--warn); background: #fff7e8; border-color: #ffe3b3; }

    .card-body { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 14px; }

    .metric-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .metric {
      background: #f7faf8;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
    .metric-label { display: block; font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .metric-value { display: block; margin-top: 4px; font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .metric-value.missing { color: var(--muted); font-weight: 400; font-size: .95rem; }

    .section-title {
      margin: 0 0 8px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
    }

    .schedule-form {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .schedule-form label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .schedule-form label.full { grid-column: 1 / -1; }

    .schedule-form input,
    .schedule-form select {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-family: inherit;
      background: #fff;
    }

    .schedule-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    .calendar {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: #fafcf9;
    }

    .calendar-head {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #eef4ef;
      border-bottom: 1px solid var(--line);
    }

    .calendar-head span {
      padding: 6px 4px;
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: var(--line);
    }

    .calendar-day {
      min-height: 52px;
      background: #fff;
      padding: 4px;
      font-size: 0.75rem;
    }

    .calendar-day.other { background: #f5f7f5; color: #9aa39c; }
    .calendar-day.today { background: #f0faf7; box-shadow: inset 0 0 0 2px #b8e4dd; }
    .calendar-day-num { font-weight: 600; margin-bottom: 2px; }

    .calendar-event {
      display: block;
      margin-top: 2px;
      padding: 1px 3px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: #0e5f58;
      font-size: 0.65rem;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .calendar-event.weekly { background: #fff4dd; color: #7a5200; }

    .history-list {
      margin: 0;
      padding: 0;
      list-style: none;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    .history-list li {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid #ece7db;
      font-size: 0.85rem;
    }
    .history-list li:last-child { border-bottom: none; }
    .history-empty { padding: 10px; color: var(--muted); font-size: 0.85rem; text-align: center; }

    .card-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .card-actions button { font-size: 0.84rem; padding: 8px 10px; }

    .relay-control {
      grid-column: 1 / -1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 600;
      min-height: 40px;
    }
    .relay-control.relay-on { background: var(--accent-soft); border-color: #bde7e2; color: #0e5f58; }
    .relay-control.relay-off { background: #fff3f2; border-color: #ffd9d6; color: #8a1c13; }
    .relay-dot { width: 9px; height: 9px; border-radius: 999px; background: currentColor; }

    .empty-state {
      background: var(--panel);
      border: 1px dashed var(--line);
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
    }

    .log {
      margin-top: 16px;
      padding: 12px;
      background: #1d2b24;
      color: #f6f8fa;
      border-radius: 10px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 0.85rem;
      min-height: 48px;
      white-space: pre-wrap;
    }

    .build-info { margin-top: 10px; text-align: right; font-size: 0.8rem; color: var(--muted); }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(31,42,36,.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.open { display: flex; }

    .modal-content {
      background: var(--panel);
      border-radius: 16px;
      padding: 24px;
      max-width: 480px;
      width: 90%;
      border: 1px solid var(--line);
      box-shadow: 0 20px 60px rgba(31,42,36,.2);
    }
    .modal h2 { margin: 0 0 16px; font-size: 1.35rem; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: var(--muted); }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fdfcf9;
      font-family: inherit;
    }

    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions button { flex: 1; padding: 10px; }
    .modal-actions button.submit { background: #1d2b24; color: #fff; border-color: #1d2b24; }

    .terminal-output, .details-json {
      margin: 0;
      padding: 12px;
      background: #111317;
      color: #e9edf3;
      border-radius: 10px;
      border: 1px solid #2a2f37;
      min-height: 180px;
      max-height: 280px;
      overflow: auto;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 0.84rem;
      white-space: pre-wrap;
    }

    .terminal-meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; }
    .terminal-dot { width: 10px; height: 10px; border-radius: 999px; background: #9ca3af; display: inline-block; }
    .terminal-dot.online { background: #16a34a; }
    .terminal-dot.offline { background: #dc2626; }

    .terminal-controls, .terminal-input-row { display: flex; gap: 8px; margin: 10px 0; }
    .terminal-input { flex: 1; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; font-family: ui-monospace, Menlo, monospace; }

    .inline-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .inline-grid label { font-size: 0.9rem; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
    .inline-grid input, .inline-grid select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-family: inherit; background: #fff; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 720px) {
      body { padding: 14px; }
      .metric-row { grid-template-columns: 1fr; }
      .schedule-form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>Huerta Bewässerung</h1>
      <p class="subtitle">Pflanzen, Klima und Bewässerungsplan auf einen Blick.</p>
    </section>

    <section class="topbar">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <span id="deviceCount" class="badge">Lade Geräte…</span>
        <span id="cosmosStatus" class="health-badge">
          <span id="cosmosDot" class="health-dot"></span>
          <span id="cosmosText">Cosmos: prüfe…</span>
        </span>
        <input id="deviceSearch" class="search-input" type="search" placeholder="Geräte suchen" />
      </div>
      <div style="display:flex;gap:8px;">
        <button id="reloadBtn" type="button">Aktualisieren</button>
        <button id="onboardBtn" type="button" class="btn-dark">ESP hinzufügen</button>
      </div>
    </section>

    <section id="deviceGrid" class="device-grid">
      <div class="empty-state">Lade Daten…</div>
    </section>

    <pre id="log" class="log">Bereit.</pre>
    <div class="build-info">Build: <span id="buildInfoText">lädt…</span></div>
  </main>

  <div id="onboardModal" class="modal">
    <div class="modal-content">
      <h2>ESP32 hinzufügen</h2>
      <form id="onboardForm">
        <div class="form-group">
          <label for="deviceId">Seriennummer *</label>
          <input type="text" id="deviceId" required placeholder="z.B. A1B2C3D4E5F6" />
        </div>
        <div class="form-group">
          <label for="deviceName">Gerätename *</label>
          <input type="text" id="deviceName" required placeholder="z.B. Küchen-Basilikum" />
        </div>
        <div class="modal-actions">
          <button type="button" id="cancelBtn">Abbrechen</button>
          <button type="submit" class="submit">Anlegen</button>
        </div>
      </form>
    </div>
  </div>

  <div id="terminalModal" class="modal">
    <div class="modal-content" style="max-width:760px;width:94%;">
      <h2 id="terminalTitle">ESP Terminal</h2>
      <div class="terminal-meta">
        <span id="terminalDot" class="terminal-dot"></span>
        <span id="terminalStatusText">Verbindung unbekannt</span>
      </div>
      <div id="terminalMeta" class="terminal-meta">Keine aktive Sitzung</div>
      <pre id="terminalOutput" class="terminal-output">Terminal öffnen…</pre>
      <div class="terminal-controls">
        <button type="button" id="wakeBtn">Aufwecken</button>
        <button type="button" id="sleepBtn">Deep Sleep</button>
      </div>
      <div class="terminal-input-row">
        <input id="terminalInput" class="terminal-input" type="text" placeholder="Befehl eingeben…" />
        <button id="terminalSendBtn" type="button">Senden</button>
      </div>
      <div class="modal-actions">
        <button type="button" id="terminalCloseBtn">Schließen</button>
      </div>
    </div>
  </div>

  <div id="detailsModal" class="modal">
    <div class="modal-content" style="max-width:780px;width:94%;">
      <h2 id="detailsTitle">Gerätedetails</h2>
      <div id="detailsMeta" class="terminal-meta">Lädt…</div>
      <pre id="detailsJson" class="details-json">Details laden…</pre>
      <div class="inline-grid">
        <label>Wi-Fi SSID<input id="wifiSsidInput" type="text" /></label>
        <label>Wi-Fi Passwort<input id="wifiPasswordInput" type="password" /></label>
        <label>Report-Intervall (s)<input id="reportIntervalInput" type="number" min="30" step="30" /></label>
        <label>Bewässerungsdauer (s)<input id="wateringDurationInput" type="number" min="10" step="1" /></label>
        <label>Sleep Mode<select id="sleepModeSelect"><option value="false">Aus</option><option value="true">An</option></select></label>
        <label>Wake-Intervall (s)<input id="wakeIntervalInput" type="number" min="60" step="60" /></label>
      </div>
      <div class="inline-grid">
        <label>Firmware-Version<input id="firmwareVersionInput" type="text" /></label>
        <label>Firmware-Datei<input id="firmwareFileInput" type="file" accept=".bin,.elf,.hex,.fw" /></label>
      </div>
      <div class="modal-actions">
        <button type="button" id="detailsCloseBtn">Schließen</button>
        <button type="button" id="uploadFirmwareBtn" class="btn-accent">Firmware hochladen</button>
        <button type="button" id="rollbackFirmwareBtn" class="btn-soft">Rollback</button>
        <button type="button" id="saveConfigBtn" class="submit">Speichern</button>
      </div>
    </div>
  </div>

  <script>
    const deviceGrid = document.getElementById("deviceGrid");
    const countBadge = document.getElementById("deviceCount");
    const deviceSearchInput = document.getElementById("deviceSearch");
    const cosmosDot = document.getElementById("cosmosDot");
    const cosmosText = document.getElementById("cosmosText");
    const buildInfoText = document.getElementById("buildInfoText");
    const reloadBtn = document.getElementById("reloadBtn");
    const logBox = document.getElementById("log");
    const terminalModal = document.getElementById("terminalModal");
    const terminalTitle = document.getElementById("terminalTitle");
    const terminalDot = document.getElementById("terminalDot");
    const terminalStatusText = document.getElementById("terminalStatusText");
    const terminalMeta = document.getElementById("terminalMeta");
    const terminalOutput = document.getElementById("terminalOutput");
    const terminalInput = document.getElementById("terminalInput");
    const terminalSendBtn = document.getElementById("terminalSendBtn");
    const terminalCloseBtn = document.getElementById("terminalCloseBtn");
    const detailsModal = document.getElementById("detailsModal");
    const detailsTitle = document.getElementById("detailsTitle");
    const detailsMeta = document.getElementById("detailsMeta");
    const detailsJson = document.getElementById("detailsJson");
    const detailsCloseBtn = document.getElementById("detailsCloseBtn");
    const saveConfigBtn = document.getElementById("saveConfigBtn");
    const wifiSsidInput = document.getElementById("wifiSsidInput");
    const wifiPasswordInput = document.getElementById("wifiPasswordInput");
    const reportIntervalInput = document.getElementById("reportIntervalInput");
    const wateringDurationInput = document.getElementById("wateringDurationInput");
    const sleepModeSelect = document.getElementById("sleepModeSelect");
    const wakeIntervalInput = document.getElementById("wakeIntervalInput");
    const firmwareVersionInput = document.getElementById("firmwareVersionInput");
    const firmwareFileInput = document.getElementById("firmwareFileInput");
    const uploadFirmwareBtn = document.getElementById("uploadFirmwareBtn");
    const rollbackFirmwareBtn = document.getElementById("rollbackFirmwareBtn");
    const wakeBtn = document.getElementById("wakeBtn");
    const sleepBtn = document.getElementById("sleepBtn");

    const WEEKDAYS = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
    const WEEKDAY_MAP = {
      monday: 1, montag: 1, mo: 1,
      tuesday: 2, dienstag: 2, di: 2,
      wednesday: 3, mittwoch: 3, mi: 3,
      thursday: 4, donnerstag: 4, do: 4,
      friday: 5, freitag: 5, fr: 5,
      saturday: 6, samstag: 6, sa: 6,
      sunday: 0, sonntag: 0, so: 0,
    };

    let activeTerminalDeviceId = "";
    let activeDeviceId = "";
    let terminalPollId = null;
    let cachedDevices = [];

    function log(message) {
      logBox.textContent = `[${new Date().toLocaleTimeString("de-DE")}] ${message}`;
    }

    function statusChip(status) {
      const safe = String(status || "unknown");
      return `<span class="chip ${safe}">${safe === "online" ? "Online" : safe === "offline" ? "Offline" : safe === "restarting" ? "Neustart" : safe}</span>`;
    }

    function formatMetric(value, unit) {
      if (value === null || value === undefined || value === "") {
        return `<span class="metric-value missing">–</span>`;
      }
      const num = Number(value);
      if (Number.isNaN(num)) {
        return `<span class="metric-value missing">–</span>`;
      }
      return `<span class="metric-value">${num.toFixed(num % 1 ? 1 : 0)}${unit}</span>`;
    }

    function formatRelativeTime(iso) {
      if (!iso) return "–";
      const then = new Date(iso);
      if (Number.isNaN(then.getTime())) return iso;
      const diffSec = Math.round((Date.now() - then.getTime()) / 1000);
      if (diffSec < 60) return `vor ${diffSec}s`;
      if (diffSec < 3600) return `vor ${Math.round(diffSec / 60)} Min.`;
      if (diffSec < 86400) return `vor ${Math.round(diffSec / 3600)} Std.`;
      return then.toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    function parseDayIndex(day) {
      if (!day) return null;
      return WEEKDAY_MAP[String(day).trim().toLowerCase()] ?? null;
    }

    function parseTimeParts(timeStr) {
      if (!timeStr || !String(timeStr).includes(":")) return null;
      const [h, m] = String(timeStr).split(":").map((x) => parseInt(x, 10));
      if (Number.isNaN(h) || Number.isNaN(m)) return null;
      return { hour: h, minute: m };
    }

    function buildWateringEvents(schedule, days = 7) {
      const events = [];
      if (!schedule || !schedule.enabled) return events;

      const now = new Date();
      const end = new Date(now);
      end.setDate(end.getDate() + days);

      const intervalHours = Number(schedule.interval_hours) || 0;
      const durationSec = Number(schedule.duration_sec) || 0;
      const dayIndex = parseDayIndex(schedule.day);
      const timeParts = parseTimeParts(schedule.start_time);

      if (intervalHours > 0) {
        const stepMs = intervalHours * 3600000;
        let cursor = new Date(now);
        cursor.setMinutes(0, 0, 0);
        while (cursor <= end) {
          if (cursor >= now) {
            events.push({
              at: new Date(cursor),
              label: `${durationSec}s`,
              type: "interval",
            });
          }
          cursor = new Date(cursor.getTime() + stepMs);
        }
      }

      if (dayIndex !== null && timeParts) {
        for (let i = 0; i <= days; i++) {
          const d = new Date(now);
          d.setDate(d.getDate() + i);
          d.setHours(timeParts.hour, timeParts.minute, 0, 0);
          const jsDay = d.getDay();
          if (jsDay === dayIndex && d >= now && d <= end) {
            events.push({
              at: d,
              label: `${schedule.day || "Wochentag"} ${timeParts.hour.toString().padStart(2, "0")}:${timeParts.minute.toString().padStart(2, "0")} · ${durationSec}s`,
              type: "weekly",
            });
          }
        }
      }

      events.sort((a, b) => a.at - b.at);
      const seen = new Set();
      return events.filter((ev) => {
        const key = ev.at.toISOString();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      }).slice(0, 40);
    }

    function renderCalendar(events) {
      const now = new Date();
      const start = new Date(now);
      const mondayOffset = (start.getDay() + 6) % 7;
      start.setDate(start.getDate() - mondayOffset);
      start.setHours(0, 0, 0, 0);

      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        days.push(d);
      }

      const eventsByDay = new Map();
      for (const ev of events) {
        const key = ev.at.toDateString();
        if (!eventsByDay.has(key)) eventsByDay.set(key, []);
        eventsByDay.get(key).push(ev);
      }

      const head = WEEKDAYS.map((d) => `<span>${d}</span>`).join("");
      const cells = days.map((day) => {
        const isToday = day.toDateString() === now.toDateString();
        const dayEvents = eventsByDay.get(day.toDateString()) || [];
        const eventHtml = dayEvents.slice(0, 3).map((ev) =>
          `<span class="calendar-event ${ev.type === "weekly" ? "weekly" : ""}">${ev.at.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })} · ${ev.label}</span>`
        ).join("");
        return `<div class="calendar-day ${isToday ? "today" : ""}">
          <div class="calendar-day-num">${day.getDate()}</div>
          ${eventHtml}
        </div>`;
      }).join("");

      return `<div class="calendar"><div class="calendar-head">${head}</div><div class="calendar-grid">${cells}</div></div>`;
    }

    function renderHistory(history) {
      const items = Array.isArray(history) ? history.slice(0, 5) : [];
      if (items.length === 0) {
        return `<div class="history-empty">Noch keine Bewässerungszyklen</div>`;
      }
      return `<ul class="history-list">${items.map((entry) => {
        const when = formatRelativeTime(entry.started_at_utc);
        const dur = entry.duration_sec != null ? `${entry.duration_sec}s` : "?";
        const src = entry.source === "manual" ? "Manuell" : entry.source === "schedule" ? "Plan" : "Auto";
        return `<li><span>${when} · ${dur}</span><span>${src}</span></li>`;
      }).join("")}</ul>`;
    }

    function renderDeviceCard(device) {
      const status = device.connected ? "online" : (device.status === "restarting" ? "restarting" : "offline");
      const plant = device.plant_context || {};
      const schedule = device.watering_schedule || {};
      const telemetry = device.telemetry || {};
      const history = device.irrigation_history || [];
      const events = buildWateringEvents(schedule, 7);

      const temp = plant.temperature_c ?? telemetry.temperature_c;
      const humidity = plant.humidity_pct ?? telemetry.humidity_pct;
      const soil = plant.soil_moisture_pct ?? telemetry.soil_moisture_pct;

      return `
        <article class="device-card" data-device-id="${device.id}">
          <header class="card-header">
            <div>
              <h2 class="card-title">${plant.plant_name || device.name || "Unbenannte Pflanze"}</h2>
              <p class="card-sub">${plant.room || "Unbekannter Raum"} · ${device.firmware || "–"}</p>
            </div>
            ${statusChip(status)}
          </header>
          <div class="card-body">
            <div>
              <h3 class="section-title">Klima</h3>
              <div class="metric-row">
                <div class="metric"><span class="metric-label">Raumtemp.</span>${formatMetric(temp, "°C")}</div>
                <div class="metric"><span class="metric-label">Luftfeuchte</span>${formatMetric(humidity, "%")}</div>
                <div class="metric"><span class="metric-label">Topf</span>${formatMetric(soil, "%")}</div>
              </div>
            </div>

            <div>
              <h3 class="section-title">Bewässerungsplan</h3>
              <form class="schedule-form" data-schedule-form="${device.id}">
                <label class="schedule-toggle full">
                  <input type="checkbox" data-field="enabled" ${schedule.enabled ? "checked" : ""} />
                  Plan aktiv
                </label>
                <label>Intervall (Std.)
                  <input type="number" min="0" step="1" data-field="interval_hours" value="${schedule.interval_hours || 2}" />
                </label>
                <label>Dauer (Sek.)
                  <input type="number" min="1" step="1" data-field="duration_sec" value="${schedule.duration_sec || 21}" />
                </label>
                <label>Wochentag
                  <select data-field="day">
                    ${["", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"].map((d) => {
                      const labels = { "": "–", Monday: "Montag", Tuesday: "Dienstag", Wednesday: "Mittwoch", Thursday: "Donnerstag", Friday: "Freitag", Saturday: "Samstag", Sunday: "Sonntag" };
                      const selected = (schedule.day || "Monday") === d ? "selected" : "";
                      return `<option value="${d}" ${selected}>${labels[d]}</option>`;
                    }).join("")}
                  </select>
                </label>
                <label>Uhrzeit
                  <input type="time" data-field="start_time" value="${schedule.start_time || "14:00"}" />
                </label>
                <label>Raum
                  <input type="text" data-field="room" value="${plant.room || ""}" placeholder="z.B. Küche" />
                </label>
                <label>Topf-Feuchte (%)
                  <input type="number" min="0" max="100" step="1" data-field="soil_moisture_pct" value="${soil ?? ""}" placeholder="Manuell" />
                </label>
                <button type="button" class="btn-accent full" data-save-schedule="${device.id}">Plan speichern</button>
              </form>
              <p class="card-sub" style="margin-top:8px;">${schedule.summary || "Kein Plan"}</p>
            </div>

            <div>
              <h3 class="section-title">Kalender (diese Woche)</h3>
              ${renderCalendar(events)}
            </div>

            <div>
              <h3 class="section-title">Letzte Zyklen</h3>
              ${renderHistory(history)}
            </div>

            <div class="card-actions">
              <button class="relay-control ${device.relay_debug_state === "on" ? "relay-on" : "relay-off"}" type="button" data-action="relay_toggle" data-device="${device.id}">
                <span class="relay-dot"></span>
                <span>Relais ${device.relay_debug_state === "on" ? "AN" : "AUS"}</span>
              </button>
              <button type="button" class="btn-accent" data-action="water_now" data-device="${device.id}">Jetzt gießen</button>
              <button type="button" data-terminal-open="true" data-device="${device.id}">Terminal</button>
              <button type="button" class="btn-soft" data-device-details="true" data-device="${device.id}">Details</button>
              <button type="button" class="btn-soft" data-action="identify" data-device="${device.id}">Identifizieren</button>
              <button type="button" class="btn-soft" data-action="restart" data-device="${device.id}">Neustart</button>
              <button type="button" class="btn-danger" data-action="delete_device" data-device="${device.id}">Löschen</button>
            </div>
          </div>
        </article>
      `;
    }

    function getFilteredDevices(devices) {
      const query = (deviceSearchInput?.value || "").trim().toLowerCase();
      if (!query) return devices;
      return devices.filter((device) => {
        const plant = device.plant_context || {};
        const haystack = `${device.name || ""} ${device.id || ""} ${plant.plant_name || ""} ${plant.room || ""}`.toLowerCase();
        return haystack.includes(query);
      });
    }

    function redirectToMicrosoftLogin() {
      const returnUrl = `${window.location.pathname}${window.location.search}${window.location.hash}`;
      window.location.href = `/.auth/login/aad?post_login_redirect_uri=${encodeURIComponent(returnUrl)}`;
    }

    async function parseApiResponse(response) {
      let data = {};
      try { data = await response.json(); } catch (_) {}
      if (response.status === 401) {
        log("Anmeldung erforderlich…");
        redirectToMicrosoftLogin();
        throw new Error("authentication redirect");
      }
      return data;
    }

    async function refreshCosmosIndicator() {
      try {
        const response = await fetch("/health");
        const data = await response.json();
        buildInfoText.textContent = (typeof data.build === "string" && data.build.trim()) ? data.build : "unbekannt";
        if (response.ok && data.cosmos_connected === true) {
          cosmosDot.className = "health-dot up";
          cosmosText.textContent = "Cosmos: verbunden";
          return;
        }
        cosmosDot.className = "health-dot down";
        cosmosText.textContent = data.cosmos_configured === false ? "Cosmos: nicht konfiguriert" : "Cosmos: getrennt";
      } catch (_) {
        cosmosDot.className = "health-dot down";
        cosmosText.textContent = "Cosmos: nicht erreichbar";
        buildInfoText.textContent = "nicht verfügbar";
      }
    }

    async function loadDevices() {
      await refreshCosmosIndicator();
      deviceGrid.innerHTML = `<div class="empty-state">Lade Daten…</div>`;

      try {
        const response = await fetch("/devices");
        const data = await parseApiResponse(response);
        if (!response.ok) throw new Error(data.message || "API-Fehler");

        cachedDevices = Array.isArray(data.devices) ? data.devices : [];
        const devices = getFilteredDevices(cachedDevices);
        countBadge.textContent = `${cachedDevices.length} Gerät${cachedDevices.length === 1 ? "" : "e"}`;

        if (devices.length === 0) {
          deviceGrid.innerHTML = `<div class="empty-state">Keine Geräte gefunden.</div>`;
          return;
        }

        deviceGrid.innerHTML = devices.map(renderDeviceCard).join("");
        log("Dashboard aktualisiert.");
      } catch (error) {
        deviceGrid.innerHTML = `<div class="empty-state">Fehler: ${String(error)}</div>`;
        countBadge.textContent = "Fehler";
        log(`Fehler: ${String(error)}`);
      }
    }

    async function saveSchedule(deviceId) {
      const form = document.querySelector(`[data-schedule-form="${deviceId}"]`);
      if (!form) return;

      const getField = (name) => form.querySelector(`[data-field="${name}"]`);
      const payload = {
        watering_schedule: {
          enabled: Boolean(getField("enabled")?.checked),
          interval_hours: Number(getField("interval_hours")?.value || 0),
          duration_sec: Number(getField("duration_sec")?.value || 21),
          day: getField("day")?.value || "",
          start_time: getField("start_time")?.value || "",
        },
        plant_profile: {
          room: getField("room")?.value?.trim() || "",
          soil_moisture_pct: getField("soil_moisture_pct")?.value === "" ? null : Number(getField("soil_moisture_pct")?.value),
        },
      };

      try {
        const response = await fetch(`/devices/${deviceId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await parseApiResponse(response);
        if (!response.ok) throw new Error(data.message || "Speichern fehlgeschlagen");
        log(`Bewässerungsplan für ${deviceId} gespeichert.`);
        await loadDevices();
      } catch (error) {
        log(`Speichern fehlgeschlagen: ${String(error)}`);
      }
    }

    async function openDetails(deviceId) {
      detailsTitle.textContent = `Gerät ${deviceId}`;
      detailsMeta.textContent = "Lädt…";
      detailsJson.textContent = "Lädt…";
      detailsModal.classList.add("open");

      try {
        const response = await fetch(`/devices/${deviceId}`);
        const data = await parseApiResponse(response);
        if (!response.ok) throw new Error(data.message || "Details nicht geladen");

        const device = data.device || {};
        const config = device.device_config || {};
        const ota = device.ota_status || {};
        activeDeviceId = deviceId;

        wifiSsidInput.value = config.wifi_ssid || "";
        wifiPasswordInput.value = config.wifi_password || "";
        reportIntervalInput.value = config.report_interval_sec || "";
        wateringDurationInput.value = config.watering_duration_sec || "";
        sleepModeSelect.value = String(Boolean(config.sleep_mode));
        wakeIntervalInput.value = config.wake_interval_sec || "";
        firmwareVersionInput.value = ota.version || "";
        detailsMeta.textContent = `Status: ${device.status || "-"} | Zuletzt: ${device.last_seen_utc || "-"}`;
        detailsJson.textContent = JSON.stringify(device, null, 2);
      } catch (error) {
        detailsMeta.textContent = `Fehler: ${String(error)}`;
        detailsJson.textContent = String(error);
      }
    }

    async function uploadFirmware() {
      if (!activeDeviceId) return;
      const file = firmwareFileInput.files?.[0];
      if (!file) { log("Bitte Firmware-Datei wählen."); return; }

      const reader = new FileReader();
      reader.onload = async () => {
        const contentBase64 = reader.result ? btoa(String.fromCharCode(...new Uint8Array(reader.result))) : "";
        try {
          const response = await fetch(`/devices/${activeDeviceId}/firmware`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              filename: file.name,
              content_base64: contentBase64,
              firmware_version: firmwareVersionInput.value.trim() || file.name,
            }),
          });
          const data = await parseApiResponse(response);
          if (!response.ok) throw new Error(data.message || "Upload fehlgeschlagen");
          log(`Firmware für ${activeDeviceId} hochgeladen.`);
          await openDetails(activeDeviceId);
        } catch (error) {
          log(`Upload fehlgeschlagen: ${String(error)}`);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    async function rollbackFirmware() {
      if (!activeDeviceId) return;
      try {
        const response = await fetch(`/devices/${activeDeviceId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ota_action: "rollback", firmware_version: firmwareVersionInput.value.trim() || "rollback" }),
        });
        const data = await parseApiResponse(response);
        if (!response.ok) throw new Error(data.message || "Rollback fehlgeschlagen");
        log(`Rollback für ${activeDeviceId} angefordert.`);
        await openDetails(activeDeviceId);
      } catch (error) {
        log(`Rollback fehlgeschlagen: ${String(error)}`);
      }
    }

    async function saveConfig() {
      if (!activeDeviceId) return;
      try {
        const response = await fetch(`/devices/${activeDeviceId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            device_config: {
              wifi_ssid: wifiSsidInput.value.trim(),
              wifi_password: wifiPasswordInput.value,
              report_interval_sec: Number(reportIntervalInput.value || 60),
              watering_duration_sec: Number(wateringDurationInput.value || 60),
              sleep_mode: sleepModeSelect.value === "true",
              wake_interval_sec: Number(wakeIntervalInput.value || 600),
            },
          }),
        });
        const data = await parseApiResponse(response);
        if (!response.ok) throw new Error(data.message || "Speichern fehlgeschlagen");
        log(`Konfiguration für ${activeDeviceId} gespeichert.`);
        await openDetails(activeDeviceId);
      } catch (error) {
        log(`Speichern fehlgeschlagen: ${String(error)}`);
      }
    }

    async function sendAction(deviceId, action, extraBody = {}) {
      if (action === "delete_device") {
        if (!window.confirm(`Gerät '${deviceId}' wirklich löschen?`)) return;
        try {
          const response = await fetch(`/devices/${deviceId}`, { method: "DELETE" });
          const data = await parseApiResponse(response);
          if (!response.ok) throw new Error(data.message || "Löschen fehlgeschlagen");
          log(`Gerät ${deviceId} gelöscht.`);
          await loadDevices();
        } catch (error) {
          log(`Löschen fehlgeschlagen: ${String(error)}`);
        }
        return;
      }

      let body;
      if (action === "restart") body = { action: "restart" };
      else if (action === "identify") body = { action: "identify", duration_sec: 15 };
      else if (action === "relay_toggle") body = { action };
      else if (action === "water_now") {
        const form = document.querySelector(`[data-schedule-form="${deviceId}"]`);
        const duration = Number(form?.querySelector('[data-field="duration_sec"]')?.value || 21);
        body = { action: "water_now", duration_sec: duration };
      } else return;

      try {
        const response = await fetch(`/devices/${deviceId}/action`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...body, ...extraBody }),
        });
        const data = await parseApiResponse(response);
        if (!response.ok) throw new Error(data.message || "Aktion fehlgeschlagen");
        log(`Aktion '${body.action}' für ${deviceId} ausgeführt.`);
        await loadDevices();
      } catch (error) {
        log(`Aktion fehlgeschlagen: ${String(error)}`);
      }
    }

    function setTerminalConnection(connected) {
      terminalDot.className = `terminal-dot ${connected ? "online" : "offline"}`;
      terminalStatusText.textContent = connected ? "ESP verbunden" : "ESP offline";
    }

    async function refreshTerminalState() {
      if (!activeTerminalDeviceId) return;
      try {
        const response = await fetch(`/devices/${activeTerminalDeviceId}/terminal`);
        const data = await parseApiResponse(response);
        if (!response.ok) throw new Error(data.message || "Terminal-Fehler");
        const term = data.terminal || {};
        setTerminalConnection(Boolean(term.connected));
        terminalMeta.textContent = `Sitzung: ${term.session_active ? "aktiv" : "inaktiv"} | Befehle: ${term.pending_commands || 0}`;
        const lines = Array.isArray(term.output) ? term.output : [];
        terminalOutput.textContent = lines.length ? lines.join("\n") : "Noch keine Ausgabe.";
        terminalOutput.scrollTop = terminalOutput.scrollHeight;
      } catch (error) {
        setTerminalConnection(false);
        terminalMeta.textContent = `Fehler: ${String(error)}`;
      }
    }

    async function openTerminal(deviceId) {
      activeTerminalDeviceId = deviceId;
      terminalTitle.textContent = "ESP Terminal";
      terminalOutput.textContent = "Öffne Terminal…";
      terminalModal.classList.add("open");
      try {
        await fetch(`/devices/${deviceId}/terminal/open`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ keep_awake_seconds: 900 }),
        });
      } catch (error) {
        log(`Terminal konnte nicht geöffnet werden: ${String(error)}`);
      }
      await refreshTerminalState();
      if (terminalPollId) clearInterval(terminalPollId);
      terminalPollId = setInterval(refreshTerminalState, 5000);
    }

    function closeTerminal() {
      terminalModal.classList.remove("open");
      activeTerminalDeviceId = "";
      if (terminalPollId) { clearInterval(terminalPollId); terminalPollId = null; }
    }

    async function sendTerminalCommand() {
      if (!activeTerminalDeviceId) return;
      const command = terminalInput.value.trim();
      if (!command) return;
      try {
        const response = await fetch(`/devices/${activeTerminalDeviceId}/terminal/command`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command }),
        });
        const data = await parseApiResponse(response);
        if (!response.ok) throw new Error(data.message || "Befehl fehlgeschlagen");
        terminalInput.value = "";
        await refreshTerminalState();
      } catch (error) {
        log(`Terminal-Befehl fehlgeschlagen: ${String(error)}`);
      }
    }

    async function requestWake() {
      if (!activeTerminalDeviceId) return;
      try {
        const response = await fetch(`/devices/${activeTerminalDeviceId}/power/wake`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ keep_awake_seconds: 900 }),
        });
        await parseApiResponse(response);
        await refreshTerminalState();
      } catch (error) {
        log(`Wake fehlgeschlagen: ${String(error)}`);
      }
    }

    async function requestSleep() {
      if (!activeTerminalDeviceId) return;
      try {
        const response = await fetch(`/devices/${activeTerminalDeviceId}/power/sleep`, { method: "POST" });
        await parseApiResponse(response);
        await refreshTerminalState();
      } catch (error) {
        log(`Sleep fehlgeschlagen: ${String(error)}`);
      }
    }

    deviceGrid.addEventListener("click", async (event) => {
      const saveBtn = event.target.closest("[data-save-schedule]");
      if (saveBtn) {
        await saveSchedule(saveBtn.getAttribute("data-save-schedule"));
        return;
      }

      const terminalBtn = event.target.closest("[data-terminal-open]");
      if (terminalBtn) {
        await openTerminal(terminalBtn.getAttribute("data-device"));
        return;
      }

      const detailsBtn = event.target.closest("[data-device-details]");
      if (detailsBtn) {
        await openDetails(detailsBtn.getAttribute("data-device"));
        return;
      }

      const btn = event.target.closest("[data-action]");
      if (!btn) return;
      const deviceId = btn.getAttribute("data-device");
      const action = btn.getAttribute("data-action");
      if (deviceId && action) await sendAction(deviceId, action);
    });

    reloadBtn.addEventListener("click", loadDevices);
    deviceSearchInput.addEventListener("input", loadDevices);
    terminalCloseBtn.addEventListener("click", closeTerminal);
    detailsCloseBtn.addEventListener("click", () => detailsModal.classList.remove("open"));
    saveConfigBtn.addEventListener("click", saveConfig);
    uploadFirmwareBtn.addEventListener("click", uploadFirmware);
    rollbackFirmwareBtn.addEventListener("click", rollbackFirmware);
    terminalSendBtn.addEventListener("click", sendTerminalCommand);
    terminalInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); sendTerminalCommand(); } });
    wakeBtn.addEventListener("click", requestWake);
    sleepBtn.addEventListener("click", requestSleep);
    terminalModal.addEventListener("click", (e) => { if (e.target === terminalModal) closeTerminal(); });
    detailsModal.addEventListener("click", (e) => { if (e.target === detailsModal) detailsModal.classList.remove("open"); });

    const modal = document.getElementById("onboardModal");
    const onboardBtn = document.getElementById("onboardBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const onboardForm = document.getElementById("onboardForm");
    const deviceIdInput = document.getElementById("deviceId");
    const deviceNameInput = document.getElementById("deviceName");

    onboardBtn.addEventListener("click", () => { modal.classList.add("open"); deviceIdInput.focus(); });
    cancelBtn.addEventListener("click", () => { modal.classList.remove("open"); onboardForm.reset(); });
    modal.addEventListener("click", (e) => { if (e.target === modal) { modal.classList.remove("open"); onboardForm.reset(); } });

    onboardForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const serial = deviceIdInput.value.trim();
      const name = deviceNameInput.value.trim();
      if (!serial || !name) { log("Seriennummer und Name sind Pflicht."); return; }
      try {
        const response = await fetch("/devices", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ serial_number: serial, name }),
        });
        const data = await parseApiResponse(response);
        if (!response.ok) throw new Error(data.message || "Anlegen fehlgeschlagen");
        log(`Gerät ${serial} angelegt.`);
        modal.classList.remove("open");
        onboardForm.reset();
        await loadDevices();
      } catch (error) {
        log(`Fehler beim Anlegen: ${String(error)}`);
      }
    });

    loadDevices();
    setInterval(loadDevices, 10000);
  </script>
</body>
</html>
